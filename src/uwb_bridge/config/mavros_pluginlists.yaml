# =============================================================================
# Plugin list for the UWB MAVROS instance.
#
# Overrides the default apm_pluginlists.yaml with an EMPTY denylist,
# so every plugin discovered via MAVROS_PLUGIN_LIBS is loaded — including
# the vision_pose plugin from mavros_extras.
# =============================================================================
/**:
  ros__parameters:
    plugin_denylist: []
    # Explicitly allow-list the plugins this pipeline needs.  Anything not
    # named here is still loaded by MAVROS' default allow-all behaviour, but
    # being explicit documents the dependency and survives future changes to
    # the apt build's default plugin set.
    plugin_allowlist:
      - odometry
      - vision_pose
      - vision_speed
      - px4_mavlink
